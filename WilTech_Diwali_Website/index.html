<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WilTech - Happy Diwali</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #fff;
      font-family: Arial, sans-serif;
    }
    .poster {
      width: min(100%, 760px);
      line-height: 0;
    }
    .poster img {
      display: block;
      width: 100%;
      height: auto;
    }
    @media (min-width: 761px) {
      body { padding: 24px 0; background: #f2edf4; }
      .poster { box-shadow: 0 8px 30px rgba(30,0,40,.18); }
    }
  </style>
</head>
<body>
  <main class="poster">
    <img src="diwali-design.jpg" alt="WilTech Happy Diwali greeting poster">
  </main>
</body>
</html>

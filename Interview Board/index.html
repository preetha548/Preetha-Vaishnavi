<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Board</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#eef3ff;
padding:30px;
}

.container{
max-width:1400px;
margin:auto;
}

h1{
text-align:center;
color:#243B55;
margin-bottom:20px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
font-size:35px;
color:#243B55;
}

.card p{
margin-top:10px;
color:gray;
}

.form{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:25px;
}

.form input,
.form select{
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

button{
background:#243B55;
color:white;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0077ff;
}

.search{
margin-bottom:20px;
}

.search input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
}

table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 10px 20px rgba(0,0,0,.1);
}

th{
background:#243B55;
color:white;
padding:15px;
}

td{
padding:12px;
text-align:center;
border-bottom:1px solid #ddd;
}

.selected{
background:#28a745;
color:white;
padding:5px 12px;
border-radius:15px;
}

.rejected{
background:#dc3545;
color:white;
padding:5px 12px;
border-radius:15px;
}

.hold{
background:orange;
color:white;
padding:5px 12px;
border-radius:15px;
}

.progress{
width:100%;
height:20px;
background:#ddd;
border-radius:20px;
margin-top:15px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#0077ff,#00d4ff);
transition:.5s;
}

footer{
margin-top:30px;
text-align:center;
color:gray;
}

</style>
</head>

<body>

<div class="container">

<h1>Interview Management Board</h1>

<div class="dashboard">

<div class="card">
<h2 id="total">0</h2>
<p>Total Candidates</p>
</div>

<div class="card">
<h2 id="selected">0</h2>
<p>Selected</p>
</div>

<div class="card">
<h2 id="rejected">0</h2>
<p>Rejected</p>
</div>

<div class="card">
<h2 id="hold">0</h2>
<p>On Hold</p>
</div>

</div>

<div class="form">

<input type="text" id="name" placeholder="Candidate Name">

<input type="text" id="role" placeholder="Job Role">

<input type="number" id="score" placeholder="Interview Score">

<select id="status">
<option>Selected</option>
<option>Rejected</option>
<option>Hold</option>
</select>

<button onclick="addCandidate()">Add Candidate</button>

</div>

<div class="search">
<input type="text" id="search" placeholder="Search Candidate..." onkeyup="searchCandidate()">
</div>

<table>

<thead>

<tr>
<th>Name</th>
<th>Role</th>
<th>Score</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<footer>
Advanced Interview Board Dashboard
</footer>

</div>

<script>

let candidates=JSON.parse(localStorage.getItem("board"))||[];

function save(){
localStorage.setItem("board",JSON.stringify(candidates));
}

function render(){

let body=document.getElementById("tableBody");
body.innerHTML="";

let selected=0;
let rejected=0;
let hold=0;

candidates.forEach((c,index)=>{

if(c.status=="Selected")selected++;
if(c.status=="Rejected")rejected++;
if(c.status=="Hold")hold++;

body.innerHTML+=`

<tr>

<td>${c.name}</td>

<td>${c.role}</td>

<td>${c.score}</td>

<td>

<span class="${c.status.toLowerCase()}">
${c.status}
</span>

</td>

<td>

<button onclick="removeCandidate(${index})">
Delete
</button>

</td>

</tr>

`;

});

document.getElementById("total").innerHTML=candidates.length;
document.getElementById("selected").innerHTML=selected;
document.getElementById("rejected").innerHTML=rejected;
document.getElementById("hold").innerHTML=hold;

let percentage=0;

if(candidates.length>0)
percentage=(selected/candidates.length)*100;

document.getElementById("bar").style.width=percentage+"%";

save();

}

function addCandidate(){

let name=document.getElementById("name").value;
let role=document.getElementById("role").value;
let score=document.getElementById("score").value;
let status=document.getElementById("status").value;

if(name==""||role==""||score==""){
alert("Fill all fields");
return;
}

candidates.push({
name,
role,
score,
status
});

render();

document.getElementById("name").value="";
document.getElementById("role").value="";
document.getElementById("score").value="";

}

function removeCandidate(i){

if(confirm("Delete Candidate?")){

candidates.splice(i,1);

render();

}

}

function searchCandidate(){

let filter=document.getElementById("search").value.toUpperCase();

let tr=document.querySelectorAll("#tableBody tr");

tr.forEach(row=>{

let txt=row.cells[0].innerText.toUpperCase();

row.style.display=txt.includes(filter)?"":"none";

});

}

render();

</script>

</body>
</html>
